version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - /app/.venv  # Exclude virtual environment from volume
    command: poetry run uvicorn play_cursor.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app 