version: '3.8'

services:
  api:
    build: .
    platform: linux/arm64
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    environment:
      - PYTORCH_ENABLE_MPS_FALLBACK=1
      - METAL_DEBUG_ERROR_MODE=1
      - MODEL_NAME=deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
      - MAX_MODEL_LEN=32768
      - MAX_BATCH_SIZE=4
    deploy:
      resources:
        reservations:
          memory: 12G
        limits:
          memory: 14G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped